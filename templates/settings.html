{% extends "base.html" %}{% block content %}<div class="heading"><div><h1>Shop Settings</h1><p>Configure shop details and loyalty reward rules.</p></div></div><section class="panel narrow"><form method="post"><div class="field"><label>Shop name</label><input name="shop_name" required value="{{ values.shop_name }}"></div><div class="field"><label>Owner display name</label><input name="owner_name" value="{{ values.owner_name }}"></div><div class="field"><label>Phone</label><input name="phone" value="{{ values.phone }}"></div><div class="field"><label>City</label><input name="city" value="{{ values.city }}"></div><div class="field"><label>Shop description</label><textarea name="description" rows="3">{{ values.description }}</textarea></div><div class="field"><label>Instagram / social URL</label><input name="instagram" value="{{ values.instagram }}" placeholder="https://instagram.com/..."></div><hr><h2>Loyalty program</h2><div class="field"><label>Stamps required for a reward (1–100)</label><input type="number" min="1" max="100" name="stamp_target" value="{{ values.stamp_target }}" required></div><div class="field"><label>Reward description</label><input name="stamp_reward" value="{{ values.stamp_reward }}"></div><button class="btn">Save settings</button></form></section>{% endblock %}
